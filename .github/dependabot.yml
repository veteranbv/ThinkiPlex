# Routine version updates. Security updates come from Dependabot alerts.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Actions in .github/workflows, pinned by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Hash-pinned CI tools (.github/ci-requirements.in and .txt).
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Application dependencies (pyproject.toml, requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # PHP downloader image.
  - package-ecosystem: docker
    directory: /thinkiplex/downloader/php
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Stay on stable PHP. Docker tags use Bundler version syntax, where
    # 8.6.0RC2 sorts before 8.6.0, so each range covers that release's
    # alphas, betas and RCs and still allows the final release.
    ignore:
      - dependency-name: php
        versions:
          - ">= 8.6.0.a, < 8.6.0"
          - ">= 8.7.0.a, < 8.7.0"
          - ">= 9.0.0.a, < 9.0.0"
